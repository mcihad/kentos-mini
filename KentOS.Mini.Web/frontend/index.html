<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover`: çentikli telefonlarda içerik ekranın tamamını
      kaplar; güvenli alan `env(safe-area-inset-*)` ile geri kazanılıyor.
      `maximum-scale` YOK — yakınlaştırmayı engellemek erişilebilirlik ihlali.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!--
      BAŞLIK VE AÇIKLAMA KURUMA GÖRE DEĞİŞİR ve buraya yazılmaz: uygulama
      başka belediyelere verilecek. Aşağıdakiler yalnızca JavaScript
      çalışana kadar görünen yer tutuculardır; gerçek değerleri
      `institution.ts` içindeki `applyDocumentIdentity` koyar
      (kaynak: GET /api/v2/institution).
    -->
    <title>KentOS.Mini</title>
    <meta name="description" content="Kurumsal ajanda, talep ve iş takip sistemi." />

    <!--
      Tema rengi: adres çubuğu ve görev anahtarlayıcı bu rengi alır.
      İki değer var çünkü koyu temada lacivert çubuk ekranın geri kalanıyla
      uyumsuz kalıyordu.
    -->
    <meta name="theme-color" content="#002E6D" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />

    <!-- ─────────────────────────── PWA ─────────────────────────── -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="icon" type="image/png" sizes="32x32" href="/ikon/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/ikon/favicon-16.png" />

    <!--
      iOS manifest'i kısmen okur: ana ekran ikonu, uygulama adı ve açılış
      görselleri hâlâ `apple-*` etiketleriyle veriliyor.
    -->
    <link rel="apple-touch-icon" href="/ikon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KentOS.Mini" />
    <meta name="application-name" content="KentOS.Mini" />

    <!--
      iOS açılış (splash) görselleri.

      iOS bunları TAM boyut eşleşmesiyle seçer; ölçüsü tutmayan bir görsel
      sessizce yok sayılır ve kullanıcı beyaz ekran görür. Bu yüzden yaygın
      cihazların hepsi tek tek listeleniyor.
    -->
    <link rel="apple-touch-startup-image" href="/ikon/acilis-1290x2796.png"
          media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/ikon/acilis-1179x2556.png"
          media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/ikon/acilis-1284x2778.png"
          media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/ikon/acilis-1170x2532.png"
          media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/ikon/acilis-1125x2436.png"
          media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/ikon/acilis-1242x2688.png"
          media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/ikon/acilis-828x1792.png"
          media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/ikon/acilis-1242x2208.png"
          media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/ikon/acilis-750x1334.png"
          media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/ikon/acilis-1536x2048.png"
          media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/ikon/acilis-1668x2388.png"
          media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/ikon/acilis-2048x2732.png"
          media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" />

    <!--
      design.md §3 — Montserrat (başlık/marka) + IBM Plex Sans (gövde).
      Google Fonts'tan yükleniyor; kurum içi ağda dış erişim yoksa
      @fontsource ile kendi sunucumuzdan servis edilmeli.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      TEMAYI İLK KAREDEN ÖNCE UYGULA.

      Tema React'te (`TemaSaglayici`) uygulanıyordu; yani ilk boyamada
      uygulama HER ZAMAN gündüz kurumsal laciverti gösteriyor, React
      bağlandığında kullanıcının seçtiği renge ve gece moduna ZIPLIYORDU.
      Kurulu bir PWA'da bu sıçrama en görünür yerde: uygulama her açılışta
      oradan başlıyor ve "web sayfası açılıyor" hissini tam da orada veriyor.

      Betik BLOKLAYICI ve küçük: yalnızca `localStorage`'daki çözülmüş
      değerleri geri oynatıyor. Palet mantığı burada TEKRARLANMIYOR —
      `TemaSaglayici` çözülmüş çekirdeği `sv-tema-cekirdek` altına yazıyor.
      Kayıt yoksa (ilk açılış) aşağıdaki varsayılanlar geçerli.
    -->
    <script>
      (function () {
        try {
          var kok = document.documentElement;

          var t = localStorage.getItem('sv-tema');
          if (t !== 'acik' && t !== 'koyu') t = 'sistem';
          var etkin =
            t === 'sistem'
              ? matchMedia('(prefers-color-scheme: dark)').matches ? 'koyu' : 'acik'
              : t;
          kok.setAttribute('data-tema', etkin);
          kok.setAttribute('data-mod', etkin);
          kok.style.colorScheme = etkin === 'koyu' ? 'dark' : 'light';

          var ham = localStorage.getItem('sv-tema-cekirdek');
          if (ham) {
            var d = JSON.parse(ham);
            for (var ad in d) if (ad.charAt(0) === '-') kok.style.setProperty(ad, d[ad]);
          }
        } catch (e) {
          /* Tema yüzünden uygulama açılmamazlık etmesin. */
        }
      })();
    </script>

    <style>
      /*
       * Açılış perdesi.
       *
       * React yüklenene kadar geçen sürede kullanıcı beyaz ekran görüyordu;
       * ana ekrandan açılan bir uygulamada bu "çöktü" izlenimi veriyor.
       * Perde HTML'in içinde, dolayısıyla ilk boyamada hazır; React
       * bağlandığında `main.tsx` onu kaldırıyor.
       */
      /*
       * Perdenin renkleri TEMADAN gelir.
       *
       * Değerler burada bir kez daha yazılıyor çünkü bu <style> ilk boyamada
       * çalışıyor ve `tokenlar.css` henüz yüklenmiş değil. Kaynak yine
       * kullanıcının markası: `--brand`/`--accent` ön-boyama betiğiyle
       * yazıldı. Gecede zemin markanın koyuya karılmış hâli — gündüz
       * laciverti gösterip sonra karanlık bir uygulamaya açılmak, açılışı
       * "yanlış uygulama açtım" hissiyle başlatıyordu.
       */
      #acilis {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        transition: opacity 0.25s ease;

        --acilis-zemin: var(--brand, #002e6d);
        --acilis-vurgu: var(--accent, #a78952);
        --acilis-rozet: #fff;
        --acilis-golge: rgba(0, 0, 0, 0.25);
        background: var(--acilis-zemin);
      }
      :root[data-tema='koyu'] #acilis {
        --acilis-zemin: color-mix(in oklab, var(--brand, #002e6d) 55%, #040810);
        --acilis-vurgu: var(--accent-dk, #d8bb80);
        --acilis-rozet: color-mix(in oklab, var(--brand, #002e6d) 14%, #101722);
        --acilis-golge: rgba(0, 0, 0, 0.5);
      }
      #acilis.gizle {
        opacity: 0;
        pointer-events: none;
      }
      /* Sarmalayıcı KENDİ İÇİNDE de ortalamalı: dış grid yalnızca kutuyu
         ekranın ortasına koyuyor, kutunun içindeki hizayı değil. Rozet
         (108px) alttaki metinden dar olduğu için sola yaslanıyordu. */
      #acilis > div {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #acilis .rozet {
        width: 108px;
        height: 108px;
        border-radius: 999px;
        background: var(--acilis-rozet);
        display: grid;
        place-items: center;
        box-shadow: 0 10px 40px var(--acilis-golge);
      }
      #acilis .rozet img {
        width: 88px;
        height: 88px;
      }
      #acilis .kural {
        width: 44px;
        height: 3px;
        border-radius: 3px;
        background: var(--acilis-vurgu);
        margin: 22px auto 0;
      }
      #acilis .ad {
        margin-top: 14px;
        text-align: center;
        color: #fff;
        font-family: Montserrat, system-ui, sans-serif;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.02em;
      }
      #acilis .alt {
        margin-top: 3px;
        text-align: center;
        color: rgba(255, 255, 255, 0.62);
        font-family: system-ui, sans-serif;
        font-size: 11.5px;
      }
      @media (prefers-reduced-motion: reduce) {
        #acilis { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="kok"></div>

    <div id="acilis" role="status" aria-label="Uygulama yükleniyor">
      <div>
        <div class="rozet">
          <img src="/ikon/ikon-192.png" alt="" width="88" height="88" />
        </div>
        <div class="kural"></div>
        <!--
          KURUM ADI KODA YAZILMAZ. Perde ilk boyamada, JavaScript modülleri
          inmeden görünmek zorunda; bu yüzden aşağıdaki iki satırı bloklayıcı
          betik `localStorage`'daki son kurum kaydından dolduruyor. İlk
          açılışta (kayıt yokken) boş kalırlar — yanlış bir kurum adı
          göstermektense boş bırakmak doğru.
        -->
        <div class="ad" id="acilis-kurum"></div>
        <div class="alt" id="acilis-uygulama">KentOS.Mini</div>
      </div>
    </div>

    <script>
      // Açılış perdesindeki kurum adını önbellekten doldur (bkz. institution.ts).
      (function () {
        try {
          var ham = localStorage.getItem('sv-kurum');
          if (!ham) return;
          var k = JSON.parse(ham);
          var ad = k.gorunenAd || k.ad;
          if (ad) document.getElementById('acilis-kurum').textContent =
            ad.toLocaleUpperCase('tr-TR');
          if (k.uygulamaAdi) document.getElementById('acilis-uygulama').textContent = k.uygulamaAdi;
        } catch (e) {
          /* Perde yüzünden açılış bozulmasın. */
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
